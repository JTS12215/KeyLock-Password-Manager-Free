<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyLock | Legacy Open Source Edition</title>
    <style>
        /* CORE STYLES */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --kl-blue: #0056b3;
            --kl-dark: #333;
            --kl-light: #f8f9fa;
            --kl-warning: #ffc107;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--kl-dark);
            background-color: #fff;
        }

        /* LEGACY BANNER */
        .legacy-banner {
            background-color: var(--kl-warning);
            color: #000;
            text-align: center;
            padding: 12px 5%;
            font-size: 0.95rem;
            border-bottom: 1px solid #e0a800;
        }
        .legacy-banner a { color: #000; font-weight: bold; text-decoration: underline; margin-left: 10px; }

        /* NAVIGATION - Desktop First */
        nav {
            background: #ffffff;
            border-bottom: 3px solid var(--kl-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5%;
            height: 100px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-container img {
            height: 80px;
            width: auto;
            display: block;
        }

        /* DESKTOP NAV LINKS */
        .nav-links {
            display: flex;
            align-items: center;
        }

        .nav-links a, .dropbtn {
            text-decoration: none;
            color: var(--kl-dark);
            font-weight: 700;
            margin-left: 25px;
            font-size: 1.1rem;
        }

        /* DROPDOWN LOGIC (Desktop) */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #ffffff;
            min-width: 200px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.1);
            border-radius: 4px;
            border-top: 3px solid var(--kl-blue);
            top: 100%;
            left: 25px;
            padding: 10px 0;
        }
        .dropdown-content a {
            color: var(--kl-dark);
            padding: 12px 20px;
            margin: 0;
            display: block;
            font-size: 1rem;
            border-bottom: 1px solid #eee;
        }
        .dropdown:hover .dropdown-content { display: block; }

        /* HIDE CHECKBOX & HAMBURGER ON DESKTOP */
        #menu-toggle { display: none; }
        .hamburger-icon { display: none; cursor: pointer; font-size: 2rem; color: var(--kl-blue); }

        /* MOBILE MENU STYLES */
        @media (max-width: 768px) {
            .hamburger-icon { display: block; } /* Show the "Pancake" icon */

            .nav-links {
                display: none; /* Hide links by default on mobile */
                flex-direction: column;
                position: absolute;
                top: 100px; /* Right under the nav bar */
                left: 0;
                width: 100%;
                background: #fff;
                border-bottom: 3px solid var(--kl-blue);
                padding: 20px 0;
                box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            }

            /* Show menu when checkbox is checked */
            #menu-toggle:checked ~ .nav-links {
                display: flex;
            }

            .nav-links a, .dropdown {
                margin: 10px 0;
                width: 100%;
                text-align: center;
            }

            .nav-links a { margin-left: 0; }

            .dropdown-content {
                position: static; /* Make dropdown push content down on mobile */
                box-shadow: none;
                border-top: none;
                background: var(--kl-light);
            }
            
            /* On mobile, we show the dropdown content differently */
            .dropdown:hover .dropdown-content { display: block; }

            .hero h1 { font-size: 2.2rem; }
            section { padding: 60px 5%; }
        }

        /* SECTION STYLES */
        section { padding: 80px 10%; border-bottom: 1px solid #eee; }
        .hero { text-align: center; background: linear-gradient(180deg, #fff 0%, var(--kl-light) 100%); }
        h1 { font-size: 3.5rem; color: #000; margin-bottom: 20px; }

        .feature-grid, .gallery-container, .donate-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 40px 0; }
        .card, .gallery-item, .donate-card, .download-card {
            flex: 1; min-width: 300px; max-width: 400px; padding: 40px;
            background: #fff; border: 1px solid #eee; border-radius: 12px;
            text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .gallery-item img { width: 100%; border-radius: 8px; border: 1px solid #ddd; }

        /* BUTTONS */
        .btn {
            display: inline-block; background: var(--kl-blue); color: white !important;
            padding: 15px 35px; border-radius: 5px; text-decoration: none; font-weight: bold; margin: 10px;
        }
        .btn-outline { background: transparent; color: var(--kl-blue) !important; border: 2px solid var(--kl-blue); }

        footer { background: var(--kl-blue); color: white; text-align: center; padding: 60px 10%; }
        footer a { color: white; text-decoration: none; margin: 0 10px; }
    </style>
</head>

<body>

    <div class="legacy-banner">
        ⚠️ <strong>LEGACY EDITION:</strong> v26.02.6.3 is no longer under active development.
        <a href="https://keylocksoftware.com">Learn about KeyLock Pro</a>
    </div>

    <nav>
        <div class="logo-container">
            <a href="#home"><img src="KeyLock_logo_Light_240pix.png" alt="KeyLock Logo"></a>
        </div>

        <input type="checkbox" id="menu-toggle">
        
        <label for="menu-toggle" class="hamburger-icon">☰</label>

        <div class="nav-links">
            <a href="#screenshots">Screenshots</a>
            <a href="#download">Download</a>
            <div class="dropdown">
                <span class="dropbtn">Resources ▾</span>
                <div class="dropdown-content">
                    <a href="docs/index.html">User Manual</a>
                    <a href="faq.html">FAQ</a>
                </div>
            </div>
            <a href="#about">About</a>
            <a href="#donate">Donate</a>
        </div>
    </nav>

    </body>
</html>
